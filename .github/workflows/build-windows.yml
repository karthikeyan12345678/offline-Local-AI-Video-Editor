name: Build Windows apps

# Builds the Windows installers. Push a tag that starts with "v" (for example v1.2.14) and the finished files appear on the
# Releases page, which is the public download page. You can also press "Run workflow" to build without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Build interfaces
        run: |
          cd frontend; npm install; npm run build; cd ..
          cd assistant-ui; npm install; npm run build; cd ..
        shell: bash
      - name: Install shell dependencies
        working-directory: electron
        run: npm install
      - name: Package VK Editor
        run: |
          node scripts/stage-electron.mjs studio
          cd electron
          npx electron-builder --win --publish never
        shell: bash
      - name: Package AI Assistant
        run: |
          node scripts/stage-electron.mjs assistant
          cd electron
          npx electron-builder --config electron-builder.assistant.yml --win --publish never
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: VKEditor-windows
          path: dist-installer/VKEditor*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: AIAssistant-windows
          path: dist-installer/AIAssistant*.exe
          if-no-files-found: error

  release:
    # Only when you push a tag that starts with "v" (see docs/SHARE-GUIDE.md). Creates the public download page.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: List files
        run: ls -lh release-files
      - uses: softprops/action-gh-release@v2
        with:
          files: release-files/*.exe
          generate_release_notes: true
          body: |
            ## How to install (no technical knowledge needed)
            1. Download **VKEditor-Setup-...exe** below (normal install) or **VKEditor-...-portable.exe** (no install, runs from any folder).
            2. Double-click it. If Windows says "Windows protected your PC", click **More info → Run anyway**.
            3. The first start downloads and installs everything by itself and shows the time left. Needs internet once; about 5–10 GB for the AI video models.
            4. Later: **Settings → Updates** shows a button when new AI parts are available.
