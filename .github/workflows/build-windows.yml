name: Build Windows apps

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Backend tests (CPU PyTorch, tiny test models)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
          sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
          python -m pytest tests -q --timeout=300
      - name: Assistant tests on the light runtime (no PyTorch)
        working-directory: backend
        run: |
          python -m venv /tmp/lean
          /tmp/lean/bin/pip install -r requirements-assistant.txt pytest==9.1.1 pytest-timeout==2.4.0
          /tmp/lean/bin/python -m pytest tests/test_assistant_docs.py tests/test_assistant_tools.py tests/test_assistant_api.py -q -k "not studio_serves" --timeout=300
      - name: Video studio interface build
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Assistant interface build
        working-directory: assistant-ui
        run: |
          npm install
          npm run build
      - name: Desktop shell tests
        working-directory: electron
        env:
          LTXPS_PYTHON: python
        run: |
          npm ci
          node --test test/runtime.test.js

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Build interfaces
        run: |
          cd frontend; npm ci; npm run build; cd ..
          cd assistant-ui; npm install; npm run build; cd ..
        shell: bash
      - name: Install shell dependencies
        working-directory: electron
        run: npm ci
      - name: Package LTX Portable Studio
        run: |
          node scripts/stage-electron.mjs studio
          cd electron
          npx electron-builder --win --publish never
        shell: bash
      - name: Package AI Assistant
        run: |
          node scripts/stage-electron.mjs assistant
          cd electron
          npx electron-builder --config electron-builder.assistant.yml --win --publish never
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: LTXPortableStudio-windows
          path: dist-installer/LTXPortableStudio*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: AIAssistant-windows
          path: dist-installer/AIAssistant*.exe
          if-no-files-found: error
