name: Build Windows apps

# Produces two separate apps from this repository:
#   VK Editor  (video generator and editor, includes the assistant as a second window)
#   AI Assistant         (stand-alone: chat, PDF/PPT/Word/CSV/Excel, compare, resume ATS, images, analytics)
on:
  push:
    branches: [main]
    tags: ["v*"]   # pushing a tag like v1.1.0 also publishes a Release with the downloadable apps
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Backend tests (CPU PyTorch, tiny test models)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
          sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
          python -m pytest tests -q --timeout=300
      - name: Assistant tests on the light runtime (no PyTorch, exactly what the Assistant app installs)
        working-directory: backend
        run: |
          python -m venv /tmp/lean
          /tmp/lean/bin/pip install -r requirements-assistant.txt pytest==9.1.1 pytest-timeout==2.4.0
          /tmp/lean/bin/python -m pytest tests/test_assistant_docs.py tests/test_assistant_tools.py tests/test_assistant_api.py -q -k "not studio_serves" --timeout=300
      - name: Video studio interface type-check and build
        working-directory: frontend
        run: |
          npm install
          npm run build
      - name: Assistant interface type-check and build
        working-directory: assistant-ui
        run: |
          npm install
          npm run build
      - name: Desktop shell tests
        working-directory: electron
        env:
          LTXPS_PYTHON: python
        run: |
          npm install
          node --test test/runtime.test.js

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Build interfaces
        run: |
          cd frontend; npm install; npm run build; cd ..
          cd assistant-ui; npm install; npm run build; cd ..
        shell: bash
      - name: Install shell dependencies
        working-directory: electron
        run: npm install
      - name: Package VK Editor
        run: |
          node scripts/stage-electron.mjs studio
          cd electron
          npx electron-builder --win --publish never
        shell: bash
      - name: Package AI Assistant
        run: |
          node scripts/stage-electron.mjs assistant
          cd electron
          npx electron-builder --config electron-builder.assistant.yml --win --publish never
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: VKEditor-windows
          path: dist-installer/VKEditor*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: AIAssistant-windows
          path: dist-installer/AIAssistant*.exe
          if-no-files-found: error

  release:
    # Only when you push a tag that starts with "v" (see docs/SHARE-GUIDE.md). Creates the public download page.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: List files
        run: ls -lh release-files
      - uses: softprops/action-gh-release@v2
        with:
          files: release-files/*.exe
          generate_release_notes: true
          body: |
            ## How to install (no technical knowledge needed)
            1. Download **VKEditor-Setup-...exe** below (normal install) or **VKEditor-...-portable.exe** (no install, runs from any folder).
            2. Double-click it. If Windows says "Windows protected your PC", click **More info → Run anyway**.
            3. The first start downloads and installs everything by itself and shows the time left. Needs internet once; about 5–10 GB for the AI video models.
            4. Later: **Settings → Updates** shows a button when new AI parts are available.
