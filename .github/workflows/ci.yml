name: Tests

# Runs on every push and pull request: the Python engine, the interface, and the browser (website) build.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Backend tests (CPU PyTorch, tiny test models)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
          sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
          set +e
          python -m pytest tests -q --timeout=300 -rfE 2>&1 | tee /tmp/pytest.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # put the failing test names on the run summary page so they are easy to read and share
            grep -E "^(FAILED|ERROR) " /tmp/pytest.log | head -15 | while IFS= read -r l; do echo "::error title=pytest::${l:0:600}"; done
            echo "::error title=pytest-tail::$(tail -40 /tmp/pytest.log | tr '\n' '|' | cut -c1-3500)"
          fi
          exit $code
      - name: Assistant tests on the light runtime (no PyTorch, exactly what the Assistant app installs)
        working-directory: backend
        run: |
          python -m venv /tmp/lean
          /tmp/lean/bin/pip install -r requirements-assistant.txt pytest==9.1.1 pytest-timeout==2.4.0
          /tmp/lean/bin/python -m pytest tests/test_assistant_docs.py tests/test_assistant_tools.py tests/test_assistant_api.py -q -k "not studio_serves" --timeout=300
      - name: Video studio interface type-check and build
        working-directory: frontend
        run: |
          npm install
          npm run build
      - name: Assistant interface type-check and build
        working-directory: assistant-ui
        run: |
          npm install
          npm run build
      - name: Desktop shell tests
        working-directory: electron
        env:
          LTXPS_PYTHON: python
        run: |
          npm install
          node --test test/runtime.test.js
      - name: Website build (the browser version that GitHub Pages and Netlify host)
        working-directory: frontend
        run: |
          npm install
          npm run build:web

