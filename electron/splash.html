<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'">
<title>VK Editor</title>
<link rel="stylesheet" href="design/tokens.css">
<link rel="stylesheet" href="design/components.css">
<link rel="stylesheet" href="splash.css">
</head>
<body>
<main>
  <h1>VK Editor</h1>
  <p id="stage" class="w-medium" aria-live="polite">Starting…</p>
  <div class="progress progress--indeterminate" id="bar" role="progressbar" aria-label="Setup progress"><span></span></div>
  <p id="detail" class="text-sm"></p>
  <ul id="steps" class="steps" aria-label="Setup steps" hidden></ul>
  <p class="text-sm" id="first">First start only: the app is downloading its runtime. Next time it opens in seconds.</p>
  <section id="fail" hidden class="stack">
    <p class="error-text" role="alert">Something went wrong</p>
    <pre id="err" class="text-xs mono card card--muted"></pre>
    <div class="row">
      <button class="btn" id="retry" type="button">Try again</button>
      <button class="btn btn--secondary" id="log" type="button">Open log</button>
      <button class="btn btn--ghost" id="quit" type="button">Quit</button>
    </div>
  </section>
</main>
<script src="splash.js"></script>
</body>
</html>
